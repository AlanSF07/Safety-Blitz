<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4650">
<meta name="robots" content="noindex">
<title>Panel Charlas CMPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1d2326; --muted:#5d676b; --line:#d9ddda;
  --accent:#e2600a; --accent-ink:#ffffff; --steel:#2f4650; --chip:#e3e9eb;
  --ok:#2e7d4f; --bad:#b8402f; --warn:#9a6a00; --ok-soft:#e2f1e7; --bad-soft:#f7e3df; --warn-soft:#f6ecd2;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141a1c; --surface:#1d2528; --ink:#e8ecea; --muted:#9aa6a9; --line:#334044;
  --accent:#f08a3e; --accent-ink:#1a1206; --steel:#24343a; --chip:#24343a;
  --ok:#7cc59b; --bad:#f0907e; --warn:#e3c06a; --ok-soft:#1f3328; --bad-soft:#3a2420; --warn-soft:#3a3220; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--steel);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-top:16px;padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
h1{font:700 28px/1.05 var(--f-display);margin:6px 0 0}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;padding-top:8px;padding-bottom:8px;overflow-x:auto}
nav.tabs button{flex:1;white-space:nowrap;font:600 15px/1 var(--f-body);padding:11px 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.badge{display:inline-block;min-width:20px;padding:2px 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 12px/16px var(--f-body);margin-left:4px}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font:700 22px/1.1 var(--f-display);margin:0 0 6px}
.muted{color:var(--muted);margin:0}
.lbl{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{font:400 16px/1.3 var(--f-body);padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:600 15px/1 var(--f-body);padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:8px 10px;font-size:14px}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;font:600 12px/1 var(--f-body);padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.neutral{background:var(--chip);color:var(--muted)}
.ses{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ses>button.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;padding:14px 16px;cursor:pointer}
.ses>button.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ses h3{margin:0;font:700 20px/1.15 var(--f-display)}
.ses .sub{font:400 13px/1.4 var(--f-mono);color:var(--muted);margin-top:4px}
.ses .det{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.asi{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px}
.asi.rech{background:var(--bad-soft)}
@media (max-width:520px){.asi{grid-template-columns:1fr}}
.asi .n{font-weight:600}
.asi .d{font:400 13px/1.5 var(--f-mono);color:var(--muted)}
.asi img{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.asi .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.asi .acts input{flex:1;min-width:160px;font:400 15px/1.3 var(--f-body);padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.valbox{background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.valbox img{max-width:220px;background:#fff;border:1px solid var(--line);border-radius:6px}
.err{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;margin:0;font-size:14px}
.okmsg{color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:10px 12px;margin:0;font-size:14px}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.prog{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi b{display:block;font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
ol.seq{margin:8px 0 0;padding:0;list-style:none}
ol.seq li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
ol.seq li .k{font:700 16px/1 var(--f-display);color:var(--muted)}
ol.seq li.next{font-weight:600}
ol.seq li.next .k{color:var(--accent)}
.sig{position:relative;border:1px dashed var(--muted);border-radius:8px;background:#fff;height:170px;touch-action:none;max-width:480px}
.sig canvas{display:block;width:100%;height:100%;touch-action:none}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.login{max-width:420px;margin:30px auto 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
  <div><div class="eyebrow">TKE · Proyecto CMPC</div><h1>Panel de charlas</h1></div>
  <div class="eyebrow" id="who"></div>
</div></header>
<nav class="tabs" id="tabs" hidden><div class="wrap" role="tablist">
  <button role="tab" data-t="pend" aria-selected="true">Por validar <span class="badge" id="nPend">0</span></button>
  <button role="tab" data-t="hist" aria-selected="false">Historial</button>
  <button role="tab" data-t="prog" aria-selected="false">Programa</button>
  <button role="tab" data-t="ajus" aria-selected="false">Ajustes</button>
</div></nav>
<main class="wrap" id="app"><p class="empty">Cargando…</p></main>

<script src="contenido.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient(SB.url,SB.key);
const app=document.getElementById("app");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad=n=>String(n).padStart(2,"0");
const charla=n=>CHARLAS.find(c=>c.n===n)||{t:"Charla "+n,a:[],c:0};
const TZ="America/Santiago";
const fecha=iso=>new Date(iso).toLocaleString("es-CL",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const diaCL=iso=>new Date(iso).toLocaleDateString("en-CA",{timeZone:TZ});
const hoyCL=()=>new Date().toLocaleDateString("en-CA",{timeZone:TZ});
const COLS_A="id,es_relator,nombre,rut,cargo,cargo_detalle,empresa,respuesta,correcta,estado,motivo_rechazo,created_at";
const COLS_S="id,created_at,planta,charla_num,ciclo,secuencia,semana_programa,estado,validada_at,validador_cargo,validador_email,observacion";
let CFG=null,SES=[],tab="pend",abierta=null;

/* ---------- Login ---------- */
async function arrancar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  const {data,error}=await sb.from("charlas_config").select("*").eq("id",1).maybeSingle();
  if(error||!data){app.innerHTML=`<div class="card login"><h2>Sin acceso</h2><p class="muted">La cuenta ${esc(session.user.email)} no tiene permiso para este panel.</p><button class="btn" id="out" style="margin-top:12px">Cerrar sesión</button></div>`;$("out").onclick=salir;return}
  CFG=data;$("who").textContent=session.user.email;$("tabs").hidden=false;
  await cargar();mostrar(tab);
}
function login(msg){
  $("tabs").hidden=true;$("who").textContent="";
  app.innerHTML=`<form class="card login" id="lf" novalidate><h2>Ingresar</h2>
    <div class="field"><label for="em">Correo</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field" style="margin-top:10px"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
    ${msg?`<p class="err" style="margin-top:10px">${esc(msg)}</p>`:""}
    <button class="btn primary" style="margin-top:14px;width:100%">Ingresar</button></form>`;
  $("lf").onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(error)return login("Correo o contraseña incorrectos.");arrancar()};
}
async function salir(){await sb.auth.signOut();login()}

/* ---------- Datos ---------- */
async function cargar(){
  const {data,error}=await sb.from("charlas_sesiones").select(COLS_S+",charlas_asistentes("+COLS_A+")").order("created_at",{ascending:false}).limit(1000);
  if(error){app.innerHTML=`<p class="err">No se pudieron cargar las sesiones. ${esc(error.message)}</p>`;return}
  SES=data.map(s=>({...s,asis:(s.charlas_asistentes||[]).sort((a,b)=>a.created_at<b.created_at?-1:1)}));
  $("nPend").textContent=SES.filter(s=>s.estado==="pendiente").length;
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>mostrar(b.dataset.t));
function mostrar(t){
  tab=t;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  ({pend:vPend,hist:vHist,prog:vProg,ajus:vAjus})[t]();
}

/* ---------- Tarjeta de sesión ---------- */
function resumen(s){
  const n=s.asis.length,inc=s.asis.filter(a=>!a.correcta).length,rech=s.asis.filter(a=>a.estado==="rechazado").length;
  const est=s.estado==="validada"?`<span class="pill ok">Validada</span>`:s.estado==="anulada"?`<span class="pill neutral">Anulada</span>`:`<span class="pill warn">Por validar</span>`;
  return `<div><h3>${pad(s.charla_num)} · ${esc(charla(s.charla_num).t)}</h3>
    <div class="sub">${esc(s.planta)} · ${fecha(s.created_at)} · ${n} asistente${n===1?"":"s"}${inc?` · ${inc} respuesta${inc===1?"":"s"} incorrecta${inc===1?"":"s"}`:""}${rech?` · ${rech} rechazado${rech===1?"":"s"}`:""}</div></div>
    <div>${est}</div>`;
}
function listaSesiones(arr,vacio){
  if(!arr.length)return `<p class="empty">${vacio}</p>`;
  return arr.map(s=>`<div class="ses" id="s-${s.id}"><button class="head" data-id="${s.id}" aria-expanded="${abierta===s.id}">${resumen(s)}</button>${abierta===s.id?`<div class="det" id="det-${s.id}"></div>`:""}</div>`).join("");
}
function enlazar(cont){
  cont.querySelectorAll("button.head").forEach(b=>b.onclick=()=>{abierta=abierta===b.dataset.id?null:b.dataset.id;mostrar(tab)});
  if(abierta&&$("det-"+abierta))detalle(SES.find(s=>s.id===abierta));
}

async function detalle(s){
  const box=$("det-"+s.id),c=charla(s.charla_num),editable=s.estado==="pendiente";
  const rel=s.asis.find(a=>a.es_relator);
  box.innerHTML=`<p class="muted">Relator en terreno: <b>${esc(rel?rel.nombre:"—")}</b> · Ciclo ${s.ciclo}, sesión ${s.secuencia} de la planta, semana ${s.semana_programa} del programa</p>
    <p class="muted">Pregunta: ${esc(c.q)} Correcta: <b>${esc(c.a[c.c]||"")}</b></p>
    ${s.asis.map(a=>`<div class="asi${a.estado==="rechazado"?" rech":""}" id="a-${a.id}">
      <div><div class="n">${esc(a.nombre)}${a.es_relator?` <span class="pill neutral">Relator</span>`:""}</div>
        <div class="d">${esc(a.rut)} · ${esc(a.cargo==="Otros"?"Otros: "+(a.cargo_detalle||""):a.cargo)} · ${esc(a.empresa)}<br>${fecha(a.created_at)}</div>
        <div style="margin-top:6px">${a.correcta?`<span class="pill ok">Respuesta correcta</span>`:`<span class="pill bad">Respondió: ${esc(c.a[a.respuesta]||"?")}</span>`}
        ${a.estado==="rechazado"?` <span class="pill bad">Rechazado: ${esc(a.motivo_rechazo||"")}</span>`:a.estado==="aprobado"?` <span class="pill ok">Aprobado</span>`:""}</div></div>
      <img id="f-${a.id}" alt="Firma de ${esc(a.nombre)}">
      ${editable?`<div class="acts">${a.estado==="rechazado"?`<button class="btn small" data-undo="${a.id}">Quitar rechazo</button>`:`<input id="m-${a.id}" placeholder="Motivo del rechazo"><button class="btn small danger" data-rech="${a.id}">Rechazar</button>`}</div>`:""}
    </div>`).join("")}
    ${editable?`<div class="valbox">
      <span class="lbl">Validación</span>
      ${CFG.firma_validador?`<p class="muted">Se firmará como <b>${esc(CFG.validador_cargo)}</b> con tu firma guardada:</p><img src="${CFG.firma_validador}" alt="Tu firma">`:`<p class="err">Primero guarda tu firma en Ajustes.</p>`}
      <div class="field"><label for="obs-${s.id}">Observación (opcional)</label><textarea id="obs-${s.id}" rows="2"></textarea></div>
      <p id="vmsg-${s.id}" hidden></p>
      <div class="row"><button class="btn primary" id="val-${s.id}" ${CFG.firma_validador?"":"disabled"}>Validar sesión</button>
        <button class="btn danger" id="anu-${s.id}">Anular sesión</button></div>
      <div class="row" id="anuc-${s.id}" hidden><span class="muted">La sesión no contará en el programa. ¿Confirmas?</span><button class="btn small danger" id="anuok-${s.id}">Sí, anular</button><button class="btn small" id="anuno-${s.id}">No</button></div>
    </div>`:s.estado==="validada"?`<div class="valbox"><span class="lbl">Validación</span><p class="muted">Validada el ${fecha(s.validada_at)} por ${esc(s.validador_cargo)} (${esc(s.validador_email)})${s.observacion?` · Observación: ${esc(s.observacion)}`:""}</p><img id="fv-${s.id}" alt="Firma del validador"></div>`:""}`;
  // firmas
  const {data:fs}=await sb.from("charlas_asistentes").select("id,firma").eq("sesion_id",s.id);
  (fs||[]).forEach(f=>{const im=$("f-"+f.id);if(im)im.src=f.firma});
  if(s.estado==="validada"){const {data:v}=await sb.from("charlas_sesiones").select("firma_validador").eq("id",s.id).single();if(v&&$("fv-"+s.id))$("fv-"+s.id).src=v.firma_validador}
  if(!editable)return;
  box.querySelectorAll("[data-rech]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.rech,m=$("m-"+id).value.trim();if(m.length<3){$("m-"+id).focus();$("m-"+id).placeholder="Escribe el motivo";return}
    await sb.from("charlas_asistentes").update({estado:"rechazado",motivo_rechazo:m}).eq("id",id);await cargar();mostrar(tab)});
  box.querySelectorAll("[data-undo]").forEach(b=>b.onclick=async()=>{
    await sb.from("charlas_asistentes").update({estado:"pendiente",motivo_rechazo:null}).eq("id",b.dataset.undo);await cargar();mostrar(tab)});
  $("val-"+s.id).onclick=async()=>{
    const b=$("val-"+s.id);b.disabled=true;b.textContent="Validando…";
    const {error}=await sb.rpc("charlas_validar_sesion",{p_id:s.id,p_observacion:$("obs-"+s.id).value});
    if(error){const m=$("vmsg-"+s.id);m.className="err";m.hidden=false;m.textContent=error.message==="SIN_FIRMA"?"Primero guarda tu firma en Ajustes.":"No se pudo validar: "+error.message;b.disabled=false;b.textContent="Validar sesión";return}
    abierta=null;await cargar();mostrar(tab)};
  $("anu-"+s.id).onclick=()=>{$("anuc-"+s.id).hidden=false};
  $("anuno-"+s.id).onclick=()=>{$("anuc-"+s.id).hidden=true};
  $("anuok-"+s.id).onclick=async()=>{await sb.from("charlas_sesiones").update({estado:"anulada"}).eq("id",s.id);abierta=null;await cargar();mostrar(tab)};
}

/* ---------- Por validar ---------- */
function vPend(){
  const arr=SES.filter(s=>s.estado==="pendiente").sort((a,b)=>a.created_at<b.created_at?-1:1);
  app.innerHTML=`<div class="row" style="justify-content:space-between"><p class="muted">Sesiones pendientes, de la más antigua a la más reciente.</p><button class="btn small" id="rf">Actualizar</button></div>
    ${listaSesiones(arr,"No hay sesiones por validar.")}`;
  $("rf").onclick=async()=>{await cargar();mostrar(tab)};
  enlazar(app);
}

/* ---------- Historial ---------- */
let F={planta:"",estado:"",desde:"",hasta:""};
function filtradas(){return SES.filter(s=>{const d=diaCL(s.created_at);return(!F.planta||s.planta===F.planta)&&(!F.estado||s.estado===F.estado)&&(!F.desde||d>=F.desde)&&(!F.hasta||d<=F.hasta)})}
function vHist(){
  const arr=filtradas();
  app.innerHTML=`<div class="card"><div class="grid4">
      <div class="field"><label for="fp">Planta</label><select id="fp"><option value="">Todas</option><option>Laja</option><option>Santa Fe</option></select></div>
      <div class="field"><label for="fe">Estado</label><select id="fe"><option value="">Todos</option><option value="pendiente">Por validar</option><option value="validada">Validada</option><option value="anulada">Anulada</option></select></div>
      <div class="field"><label for="fd">Desde</label><input type="date" id="fd" value="${F.desde}"></div>
      <div class="field"><label for="fh">Hasta</label><input type="date" id="fh" value="${F.hasta}"></div></div>
    <div class="row" style="margin-top:12px;justify-content:space-between"><span class="muted">${arr.length} sesiones · ${arr.reduce((t,s)=>t+s.asis.length,0)} firmas</span><button class="btn primary" id="csv">Descargar Excel (CSV)</button></div></div>
    ${listaSesiones(arr,"No hay sesiones con estos filtros.")}`;
  $("fp").value=F.planta;$("fe").value=F.estado;
  [["fp","planta"],["fe","estado"],["fd","desde"],["fh","hasta"]].forEach(([id,k])=>$(id).onchange=()=>{F[k]=$(id).value;vHist()});
  $("csv").onclick=()=>csv(arr);
  enlazar(app);
}
function csv(arr){
  const cab=["Fecha","Planta","Charla N°","Charla","Ciclo","Estado sesión","Relator en terreno","Nombre","RUT","Cargo","Empresa","Respuesta","Estado asistente","Motivo rechazo","Validada el","Validado por"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const filas=[];
  arr.forEach(s=>{const rel=(s.asis.find(a=>a.es_relator)||{}).nombre;s.asis.forEach(a=>filas.push([fecha(a.created_at),s.planta,s.charla_num,charla(s.charla_num).t,s.ciclo,s.estado,rel,a.nombre,a.rut,a.cargo==="Otros"?"Otros: "+(a.cargo_detalle||""):a.cargo,a.empresa,a.correcta?"Correcta":"Incorrecta",a.estado,a.motivo_rechazo,s.validada_at?fecha(s.validada_at):"",s.validador_cargo]))});
  const txt="﻿"+[cab,...filas].map(l=>l.map(q).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  a.download=`charlas_cmpc_${hoyCL()}.csv`;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- Programa ---------- */
function vProg(){
  const hoy=hoyCL(),ini=CFG.inicio,total=CFG.total_charlas||8;
  const semana=hoy<ini?0:Math.floor((Date.parse(hoy)-Date.parse(ini))/(7*864e5))+1;
  app.innerHTML=`<p class="muted">Programa iniciado el ${esc(ini)} · Semana ${semana} · Se libera una charla cada lunes a las 00:01.</p><div class="prog">${["Laja","Santa Fe"].map(p=>{
    const ses=SES.filter(s=>s.planta===p&&s.estado!=="anulada");
    const hechas=ses.length,dif=hechas-semana,prox=(hechas%total)+1,ciclo=Math.floor(hechas/total)+1;
    const est=dif<0?`<span class="pill bad">Atrasada ${-dif} semana${dif===-1?"":"s"}</span>`:dif>0?`<span class="pill ok">Adelantada ${dif}</span>`:`<span class="pill ok">Al día</span>`;
    const enCiclo=ses.filter(s=>s.ciclo===ciclo);
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${p}</h2>${est}</div>
      <div class="kpis"><div class="kpi"><b>${hechas}</b><span>Charlas hechas</span></div><div class="kpi"><b>${semana}</b><span>Esperadas a hoy</span></div><div class="kpi"><b>${ciclo}</b><span>Ciclo actual</span></div></div>
      <span class="lbl">Ciclo ${ciclo}</span>
      <ol class="seq">${CHARLAS.map(c=>{const s=enCiclo.find(x=>x.charla_num===c.n);
        return `<li class="${c.n===prox?"next":""}"><span class="k">${pad(c.n)}</span><span>${esc(c.t)}</span>${s?(s.estado==="validada"?`<span class="pill ok">Validada</span>`:`<span class="pill warn">Por validar</span>`):c.n===prox?`<span class="pill neutral">Siguiente</span>`:""}</li>`}).join("")}</ol></div>`}).join("")}</div>`;
}

/* ---------- Ajustes ---------- */
function vAjus(){
  app.innerHTML=`<div class="card"><h2>Mi firma de validación</h2><p class="muted">Se usa al validar cada sesión, como ${esc(CFG.validador_cargo)}.</p>
      ${CFG.firma_validador?`<p class="lbl" style="margin-top:10px">Firma guardada</p><img src="${CFG.firma_validador}" alt="Firma guardada" style="max-width:240px;background:#fff;border:1px solid var(--line);border-radius:6px">`:""}
      <p class="lbl" style="margin-top:12px">${CFG.firma_validador?"Reemplazar firma":"Dibuja tu firma"}</p>
      <div class="sig" id="sigbox"><canvas id="cv"></canvas></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="gf">Guardar firma</button><button class="btn" id="bf">Borrar</button></div><p id="mf" hidden></p></div>
    <div class="card"><h2>Inicio del programa</h2><p class="muted">Lunes desde el que se cuentan las semanas. Cambiarlo no altera las charlas ya hechas.</p>
      <div class="row" style="margin-top:10px"><div class="field"><input type="date" id="ini" value="${esc(CFG.inicio)}"></div><button class="btn primary" id="gi">Guardar</button></div><p id="mi" hidden></p></div>
    <div class="card"><h2>Cambiar contraseña</h2>
      <div class="row" style="margin-top:10px"><div class="field" style="flex:1"><input type="password" id="np" autocomplete="new-password" placeholder="Nueva contraseña (mínimo 8 caracteres)"></div><button class="btn primary" id="gp">Cambiar</button></div><p id="mp" hidden></p></div>
    <div class="card"><h2>Links</h2><p class="muted">Formulario para técnicos:</p><p style="margin:4px 0 10px;font:400 14px/1.4 var(--f-mono);word-break:break-all">${esc(location.origin+location.pathname.replace(/panel\.html$/,""))}</p><button class="btn" id="out">Cerrar sesión</button></div>`;
  const cv=$("cv"),box=$("sigbox"),dpr=window.devicePixelRatio||1;cv.width=box.clientWidth*dpr;cv.height=box.clientHeight*dpr;
  const x=cv.getContext("2d");x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap="round";x.strokeStyle="#1d2326";let on=false,hecha=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{e.preventDefault();on=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();hecha=true};
  cv.onpointerup=cv.onpointercancel=()=>on=false;
  $("bf").onclick=()=>{x.clearRect(0,0,cv.width,cv.height);hecha=false};
  const msg=(id,ok,t)=>{const m=$(id);m.hidden=false;m.className=ok?"okmsg":"err";m.style.marginTop="10px";m.textContent=t};
  $("gf").onclick=async()=>{if(!hecha)return msg("mf",false,"Dibuja tu firma primero.");
    const t=document.createElement("canvas");t.width=400;t.height=Math.round(400*cv.height/cv.width);const tx=t.getContext("2d");tx.fillStyle="#fff";tx.fillRect(0,0,t.width,t.height);tx.drawImage(cv,0,0,t.width,t.height);
    const f=t.toDataURL("image/png");const {error}=await sb.from("charlas_config").update({firma_validador:f,updated_at:new Date().toISOString()}).eq("id",1);
    if(error)return msg("mf",false,error.message);CFG.firma_validador=f;vAjus();msg("mf",true,"Firma guardada.")};
  $("gi").onclick=async()=>{const v=$("ini").value;if(!v)return;if(new Date(v+"T12:00:00").getDay()!==1)return msg("mi",false,"La fecha debe ser un lunes.");
    const {error}=await sb.from("charlas_config").update({inicio:v,updated_at:new Date().toISOString()}).eq("id",1);if(error)return msg("mi",false,error.message);CFG.inicio=v;msg("mi",true,"Inicio actualizado.")};
  $("gp").onclick=async()=>{const p=$("np").value;if(p.length<8)return msg("mp",false,"Usa al menos 8 caracteres.");
    const {error}=await sb.auth.updateUser({password:p});if(error)return msg("mp",false,error.message);$("np").value="";msg("mp",true,"Contraseña cambiada.")};
  $("out").onclick=salir;
}

arrancar();
</script>
